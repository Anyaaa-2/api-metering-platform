server.port=8080

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Default policy for any client without a custom one (per window):
#   requests 1-5  -> FREE
#   requests 6-10 -> BILLABLE at 50 paise (Rs 0.50) each
#   requests 11+  -> BLOCKED (429)
metering.default-free-limit=5
metering.default-max-requests=10
metering.default-unit-cost-paise=50
metering.default-window-seconds=60

# How long per-minute usage history is kept (24 hours)
metering.history-ttl-seconds=86400

# Required to use /admin/**. If empty, the admin API is disabled.
metering.admin-api-key=${ADMIN_API_KEY:}
